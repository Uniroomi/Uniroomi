# This file is for CI/CD systems (GitHub Actions, etc.), not cPanel Git Version Control
# cPanel Git Version Control does not execute .cpanel.yml tasks
# To fix cPanel deployment, set Repository Path to /home/username/public_html in cPanel Git settings

---
deployment:
  tasks:
    - export REPOPATH=/home/yourusername/repositories/Uniroomi-main
    - export MAINPATH=/home/yourusername/public_html
    - /bin/cp -R $REPOPATH/* $MAINPATH/
    - /bin/cp -R $REPOPATH/.[^.]* $MAINPATH/ 2>/dev/null || true